name: Thursday send and backup

on:
  schedule:
    - cron: '0 13 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write

# A manual "Send now" run overlapping the scheduled run would otherwise let
# both fire the email step before either reaches the push, sending real
# players a duplicate.
concurrency:
  group: thursday-send
  cancel-in-progress: false

jobs:
  send-and-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js declares engines.node >= 22.0.0; Node 20
          # can install it (npm only warns) but isn't a version the package
          # actually supports running under.
          node-version: 22

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Send weekly email
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node send-weekly-email.mjs

      - name: Back up scores to CSV
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node backup-scores.mjs

      - name: Commit backup CSVs if changed
        run: |
          git config user.name "bakeoff-bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Weekly score backup $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
