name: Thursday send and backup

on:
  schedule:
    # Off the hour on purpose: GitHub Actions documents that schedule events
    # queue at the top of every hour under high load and can be delayed
    # several hours (observed: the Wednesday reminder's first run, scheduled
    # for 0 13, actually fired at 17:38) or dropped outright.
    - cron: '7 13 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read

# A manual "Send now" run overlapping the scheduled run would otherwise let
# both read the episode as not-yet-sent and fire the email step before
# either writes email_sent_at back, sending real players a duplicate.
concurrency:
  group: thursday-send
  cancel-in-progress: false

jobs:
  send-and-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js declares engines.node >= 22.0.0; Node 20
          # can install it (npm only warns) but isn't a version the package
          # actually supports running under.
          node-version: 22

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Send weekly email
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node send-weekly-email.mjs

      - name: Back up scores to CSV
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node backup-scores.mjs
