name: Send test weekly email

# Sends a "[TEST]" draft of the current episode's weekly email to the copy
# recipients only (WEEKLY_EMAIL_CC, else the admins). Never emails players and
# never marks the episode as sent.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Send test email
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          WEEKLY_EMAIL_CC: ${{ secrets.WEEKLY_EMAIL_CC }}
        run: node send-weekly-email.mjs --test
